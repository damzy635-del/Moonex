name: Repair provider classifier on PR

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/provider-diagnostics-fallback-v3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-diagnostics-fallback-v3
          fetch-depth: 0
      - name: Repair classifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/chat.ts')
          s = p.read_text()
          old = """function classifyProviderError(status: number, message: string): { reason: string; retryable: boolean } {\n  const text = message.toLowerCase();\n  if (status === 401 || status === 403 || /invalid.*(api|key)|authentication|unauthorized|forbidden|credential/i.test(text)) {\n    return { reason: 'AUTHENTICATION_FAILED', retryable: false };\n  }\n  if (status === 404 || /model.*(not found|does not exist|unavailable)/i.test(text)) {\n    return { reason: 'MODEL_UNAVAILABLE', retryable: false };\n  }\n  if (status === 400 || status === 422 || /invalid (request|parameter)|validation error|malformed/i.test(text)) {\n    return { reason: 'INVALID_REQUEST', retryable: false };\n  }\n  if (status === 429 || /rate.?limit|too many requests|quota exceeded|capacity/i.test(text)) {\n    return { reason: 'RATE_LIMITED', retryable: true };\n  }\n  if (status === 408 || /timeout|timed out/i.test(text)) return { reason: 'TIMEOUT', retryable: true };\n  if (status >= 500 || /overload|overloaded|temporarily unavailable|upstream|bad gateway|service unavailable/i.test(text)) {\n    return { reason: 'UPSTREAM_UNAVAILABLE', retryable: true };\n  }\n  return { reason: RETRYABLE_STATUS.has(status) ? 'UPSTREAM_RETRYABLE_ERROR' : 'PROVIDER_ERROR', retryable: RETRYABLE_STATUS.has(status) };\n}\n"""
          new = """function classifyProviderError(status: number, message: string): { reason: string; retryable: boolean } {\n  const text = message.toLowerCase();\n\n  // HTTP status is authoritative for transport/auth semantics. A gateway can\n  // include an authentication-looking message while returning a 5xx.\n  if (status === 401 || status === 403) return { reason: 'AUTHENTICATION_FAILED', retryable: false };\n  if (status === 404) return { reason: /model.*(not found|does not exist|unavailable)/i.test(text) ? 'MODEL_UNAVAILABLE' : 'PROVIDER_ERROR', retryable: false };\n  if (status === 400 || status === 422) return { reason: 'INVALID_REQUEST', retryable: false };\n  if (status === 429) return { reason: 'RATE_LIMITED', retryable: true };\n  if (status === 408 || /timeout|timed out/i.test(text)) return { reason: 'TIMEOUT', retryable: true };\n  if (status >= 500 || /overload|overloaded|temporarily unavailable|upstream|bad gateway|service unavailable/i.test(text)) return { reason: 'UPSTREAM_UNAVAILABLE', retryable: true };\n  if (/invalid.*(api|key)|authentication|unauthorized|forbidden|credential/i.test(text)) return { reason: 'AUTHENTICATION_FAILED', retryable: false };\n  if (/model.*(not found|does not exist|unavailable)/i.test(text)) return { reason: 'MODEL_UNAVAILABLE', retryable: false };\n  if (/invalid (request|parameter)|validation error|malformed/i.test(text)) return { reason: 'INVALID_REQUEST', retryable: false };\n  return { reason: RETRYABLE_STATUS.has(status) ? 'UPSTREAM_RETRYABLE_ERROR' : 'PROVIDER_ERROR', retryable: RETRYABLE_STATUS.has(status) };\n}\n"""
          if old not in s:
              raise SystemExit('Expected classifier block was not found; refusing to modify the branch.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Add regression test
        run: |
          cat > tests/provider-error-classification.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import fs from 'node:fs';
          import path from 'node:path';

          test('5xx provider responses cannot be classified as authentication failures', () => {
            const source = fs.readFileSync(path.resolve('api/chat.ts'), 'utf8');
            assert.match(source, /if \(status === 401 \|\| status === 403\)/);
            assert.doesNotMatch(source, /status === 401 \|\| status === 403 \|\| \/invalid\.\*\(api\|key\)/);
          });
          EOF
      - run: npm ci
      - run: node --import tsx --test tests/provider-error-classification.test.ts
      - run: npm test
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/chat.ts tests/provider-error-classification.test.ts
          git commit -m 'fix: classify 5xx provider failures by status' || exit 0
          git push origin HEAD:fix/provider-diagnostics-fallback-v3
