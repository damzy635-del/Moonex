name: P1.5 message state wiring
on:
  push:
    branches: [fix/p1-message-state-integrity-wiring-v1]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire App.tsx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()

          s = s.replace(
              "import { normalizeMoonexModelId } from '../lib/moonex-models';",
              "import { normalizeMoonexModelId } from '../lib/moonex-models';\nimport { prepareMessageEdit, prepareMessageRegeneration } from './utils/conversationActions';",
              1,
          )

          s = s.replace(
              "const msgIndex = currentConversation.messages.findIndex((m) => m.id === messageId);\n    if (msgIndex === -1) return;\n\n    const targetMsg = currentConversation.messages[msgIndex];\n    // Keep messages strictly prior to this message\n    const trimmed = currentConversation.messages.slice(0, msgIndex);",
              "const mutation = prepareMessageEdit(currentConversation.messages, messageId, newContent);\n    if (!mutation || !mutation.targetMessage) return;\n\n    const trimmed = mutation.messages;",
              1,
          )
          s = s.replace(
              "    // Resubmit with new content\n    handleSendMessage(newContent, targetMsg.files || []);",
              "    // Resubmit from the authoritative pre-edit snapshot.\n    handleSendMessage(mutation.targetMessage.content, mutation.targetMessage.files || [], undefined, mutation.messages);",
              1,
          )
          s = s.replace(
              "    modelOverride?: string,\n  ) => {",
              "    modelOverride?: string,\n    baseMessages?: Message[],\n  ) => {",
              1,
          )
          s = s.replace(
              "    if ((!text.trim() && files.length === 0) || isStreaming) return;\n\n    const selectedModelId",
              "    if ((!text.trim() && files.length === 0) || isStreaming) return;\n\n    const conversationMessages = baseMessages ?? currentConversation.messages;\n    const selectedModelId",
              1,
          )
          s = s.replace(
              "const isFirstUserMessage = currentConversation.messages.length === 0;",
              "const isFirstUserMessage = conversationMessages.length === 0;",
              1,
          )
          s = s.replace(
              "const updatedMessages = [...currentConversation.messages, userMessage];",
              "const updatedMessages = [...conversationMessages, userMessage];",
              1,
          )

          start = s.index('  const handleRegenerate = () => {')
          end = s.index('\n\n  // Text-to-Speech audio reader', start)
          s = s[:start] + '''  const handleRegenerate = () => {
    if (!user || isAnonymous) {
      setAuthModalMode('signin');
      setIsAuthModalOpen(true);
      return;
    }

    const mutation = prepareMessageRegeneration(currentConversation.messages);
    if (!mutation || !mutation.targetMessage) return;

    setConversations((prev) =>
      prev.map((c) =>
        c.id === activeConversationId
          ? { ...c, messages: mutation.messages }
          : c
      )
    );

    handleSendMessage(
      mutation.targetMessage.content,
      mutation.targetMessage.files || [],
      undefined,
      mutation.messages,
    );
  };''' + s[end:]

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'P1.5 message state wiring applied'
          git push
