name: Repair P1 message mutation wiring

on:
  push:
    branches: [phase-p3-chat-ux]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Normalize durable P1.6 snapshot wiring
        shell: python
        run: |
          from pathlib import Path
          import re

          app_path = Path('src/App.tsx')
          source = app_path.read_text()
          pattern = re.compile(
              r'handleSendMessage\(\s*'
              r'mutation\.targetMessage\.content,\s*'
              r'mutation\.targetMessage\.files\s*\|\|\s*\[\]'
              r'(?:\s*,\s*undefined)?'
              r'(?:\s*,\s*mutation\.messages)?\s*\)',
              re.MULTILINE,
          )
          replacement = (
              'handleSendMessage(mutation.targetMessage.content, '
              'mutation.targetMessage.files || [], undefined, mutation.messages)'
          )
          source, count = pattern.subn(lambda _match: replacement, source)
          if count != 3:
              raise SystemExit(f'Expected exactly 3 P1.6 mutation resend calls, found {count}')
          app_path.write_text(source)
          print(f'Normalized {count} mutation resend calls.')

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit durable fix and remove repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/repair-p1-message-mutations.yml
          git add src/App.tsx .github/workflows/repair-p1-message-mutations.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore durable P1.6 mutation snapshot wiring'
          git push origin HEAD:phase-p3-chat-ux
