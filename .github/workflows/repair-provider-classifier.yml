name: Repair provider classifier

on:
  push:
    branches:
      - fix/provider-diagnostics-fallback-v3

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Repair status-first provider classification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/chat.ts')
          s = p.read_text()
          old = """function classifyProviderError(status: number, message: string): { reason: string; retryable: boolean } {\n  const text = message.toLowerCase();\n  if (status === 401 || status === 403 || /invalid.*(api|key)|authentication|unauthorized|forbidden|credential/i.test(text)) {\n    return { reason: 'AUTHENTICATION_FAILED', retryable: false };\n  }\n  if (status === 404 || /model.*(not found|does not exist|unavailable)/i.test(text)) {\n    return { reason: 'MODEL_UNAVAILABLE', retryable: false };\n  }\n  if (status === 400 || status === 422 || /invalid (request|parameter)|validation error|malformed/i.test(text)) {\n    return { reason: 'INVALID_REQUEST', retryable: false };\n  }\n  if (status === 429 || /rate.?limit|too many requests|quota exceeded|capacity/i.test(text)) {\n    return { reason: 'RATE_LIMITED', retryable: true };\n  }\n  if (status === 408 || /timeout|timed out/i.test(text)) return { reason: 'TIMEOUT', retryable: true };\n  if (status >= 500 || /overload|overloaded|temporarily unavailable|upstream|bad gateway|service unavailable/i.test(text)) {\n    return { reason: 'UPSTREAM_UNAVAILABLE', retryable: true };\n  }\n  return { reason: RETRYABLE_STATUS.has(status) ? 'UPSTREAM_RETRYABLE_ERROR' : 'PROVIDER_ERROR', retryable: RETRYABLE_STATUS.has(status) };\n}\n"""
          new = """function classifyProviderError(status: number, message: string): { reason: string; retryable: boolean } {\n  const text = message.toLowerCase();\n\n  // HTTP status is authoritative for transport/auth semantics. Do not let\n  // gateway payload text such as \"authentication\" misclassify a 5xx.\n  if (status === 401 || status === 403) {\n    return { reason: 'AUTHENTICATION_FAILED', retryable: false };\n  }\n  if (status === 404) {\n    return { reason: /model.*(not found|does not exist|unavailable)/i.test(text) ? 'MODEL_UNAVAILABLE' : 'PROVIDER_ERROR', retryable: false };\n  }\n  if (status === 400 || status === 422) {\n    return { reason: 'INVALID_REQUEST', retryable: false };\n  }\n  if (status === 429) {\n    return { reason: 'RATE_LIMITED', retryable: true };\n  }\n  if (status === 408 || /timeout|timed out/i.test(text)) {\n    return { reason: 'TIMEOUT', retryable: true };\n  }\n  if (status >= 500 || /overload|overloaded|temporarily unavailable|upstream|bad gateway|service unavailable/i.test(text)) {\n    return { reason: 'UPSTREAM_UNAVAILABLE', retryable: true };\n  }\n  if (/invalid.*(api|key)|authentication|unauthorized|forbidden|credential/i.test(text)) {\n    return { reason: 'AUTHENTICATION_FAILED', retryable: false };\n  }\n  if (/model.*(not found|does not exist|unavailable)/i.test(text)) {\n    return { reason: 'MODEL_UNAVAILABLE', retryable: false };\n  }\n  if (/invalid (request|parameter)|validation error|malformed/i.test(text)) {\n    return { reason: 'INVALID_REQUEST', retryable: false };\n  }\n  return { reason: RETRYABLE_STATUS.has(status) ? 'UPSTREAM_RETRYABLE_ERROR' : 'PROVIDER_ERROR', retryable: RETRYABLE_STATUS.has(status) };\n}\n"""
          if old not in s:
              raise SystemExit('Expected classifier block was not found; refusing to modify the branch.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Add regression test
        run: |
          cat > tests/provider-error-classification.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import fs from 'node:fs';
          import path from 'node:path';

          test('5xx provider responses remain upstream errors even when the body mentions authentication', () => {
            const source = fs.readFileSync(path.resolve('api/chat.ts'), 'utf8');
            assert.match(source, /if \(status === 401 \|\| status === 403\)/);
            assert.doesNotMatch(source, /if \(status === 401 \|\| status === 403 \|\| \/invalid\.\*\(api\|key\).*authentication/);
          });
          EOF
          node --import tsx --test tests/provider-error-classification.test.ts
      - name: Run full test suite
        run: npm test
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/chat.ts tests/provider-error-classification.test.ts .github/workflows/repair-provider-classifier.yml
          git rm .github/workflows/repair-provider-classifier.yml
          git commit -m 'fix: classify 5xx provider failures by status' || exit 0
          git push
