name: Apply P1.6 retry patch

on:
  push:
    branches:
      - feat/p1-message-retry-v1

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'P1.6 retry wiring applied')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: node scripts/apply-p1-6-retry.js

      - name: Remove temporary patch tooling
        run: |
          rm -f scripts/apply-p1-6-retry.js
          rm -f .github/workflows/p1-message-retry-apply.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/MessageItem.tsx tests/conversation-retry.test.ts package.json
          git add -u scripts/apply-p1-6-retry.js .github/workflows/p1-message-retry-apply.yml
          git commit -m "P1.6 retry wiring applied"
          git push
