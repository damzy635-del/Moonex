name: Repair pnpm lockfile

on:
  push:
    branches: [phase-p3-chat-ux]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only

      - name: Verify frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit durable lockfile and remove repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/repair-pnpm-lockfile.yml
          git add pnpm-lock.yaml .github/workflows/repair-pnpm-lockfile.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: synchronize pnpm lockfile with package manifest'
          git push origin HEAD:phase-p3-chat-ux
